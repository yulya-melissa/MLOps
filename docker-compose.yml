x-pipeline-env: &pipeline-env
  FIRE_RABBIT_URL: amqp://fire:fire_password@rabbitmq:5672/
  FIRE_TASKS_QUEUE: fire.tasks
  FIRE_QUEUE_MAX_LENGTH: 100
  FIRE_DATA_DIR: /app/data

services:
  postgres:
    image: postgres:16-alpine
    container_name: fire_detection_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: fire_detection
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fire_detection"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fire_detection_app
    ports:
      - "8000:8000"
    environment:
      FIRE_POSTGRES_HOST: postgres
      FIRE_POSTGRES_PORT: 5432
      FIRE_POSTGRES_USER: postgres
      FIRE_POSTGRES_PASSWORD: postgres_password
      FIRE_POSTGRES_DB: fire_detection
      FIRE_LOG_LEVEL: INFO
      FIRE_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mlflow-db:
    image: postgres:16-alpine
    container_name: mlflow_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    container_name: mlflow_rustfs
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_SERVER_DOMAINS: rustfs:9000,localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  create-bucket:
    image: amazon/aws-cli:latest
    container_name: mlflow_create_bucket
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket mlflow-artifacts --region us-east-1 || true;
      echo 'Bucket ready';
      "
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    depends_on:
      mlflow-db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow_password@mlflow-db:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts/
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Конвейер: источник -> ограниченная очередь RabbitMQ -> воркер
  # ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fire_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fire
      RABBITMQ_DEFAULT_PASS: fire_password
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # container_name намеренно НЕ задаём: иначе не получится --scale worker=2
    environment:
      <<: *pipeline-env
      FIRE_MLFLOW_TRACKING_URI: http://mlflow:5000
      FIRE_MODEL_URI: models:/fire-detector@champion
      FIRE_PREFETCH_COUNT: 1
      FIRE_INFERENCE_CONCURRENCY: 1
      FIRE_INFERENCE_DELAY_S: 0.5
      OMP_NUM_THREADS: 1
    volumes:
      - ./data:/app/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

  source:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "src.source"]
    profiles: ["load"]   # сам не стартует: docker compose --profile load up source
    environment:
      <<: *pipeline-env
      FIRE_SOURCE_REPEAT: 1
    volumes:
      - ./data:/app/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pg_data:
  mlflow_pg_data:
  rustfs_data:
  rabbitmq_data:
