name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-cov pytest-asyncio ruff httpx

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Formatting with Ruff
        run: ruff format --check .

      - name: Run Tests with Coverage
        run: |
          pytest -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml tests/

      # 3. ????????? ?????????? ?????? ? ?????????? GitHub Actions
      - name: Generate Coverage Summary
        if: success() || failure()
        run: |
          echo "Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest --cov=src --cov-report=term-missing tests/ | grep -E "(TOTAL|Name|src/)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
