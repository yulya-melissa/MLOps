services:
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.0}
    container_name: fire_loki
    profiles: [ "logs", "observability" ]
    command: [ "-config.file=/etc/loki/config.yaml" ]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    mem_limit: 512m
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.21.3}
    container_name: fire_alloy
    profiles: [ "logs", "observability" ]
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./log-agent/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      COMPOSE_PROJECT: ${COMPOSE_PROJECT:-mlops}
      LOG_ENV: ${LOG_ENV:-production}
    ports:
      - "12345:12345"
    healthcheck:
      test: [ "CMD-SHELL", "pidof alloy > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  loki_data:
  alloy_data:
