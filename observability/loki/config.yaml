# Loki в режиме single-binary: один процесс, хранение на файловой системе.
# Для стенда достаточно: поток логов — десятки КБ/с, ретеншн 3 суток.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory        # один инстанс — внешнее KV не нужно
  storage:
    filesystem:
      chunks_directory: /loki/chunks

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb            # индекс только по лейблам
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  retention_enabled: true    # без этого retention_period не применяется
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

limits_config:
  retention_period: 72h      # 3 суток — короткий ретеншн стенда
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  volume_enabled: true       # /index/volume — объём логов по лейблам

analytics:
  reporting_enabled: false

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules